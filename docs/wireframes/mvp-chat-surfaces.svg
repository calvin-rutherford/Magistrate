<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:18px;font-weight:700;fill:#f7f8fa}.label{font-size:13px;font-weight:700;fill:#24d8ff}.body{font-size:12px;fill:#b9c2d0}.muted{font-size:11px;fill:#8e99aa}.frame{fill:#111722;stroke:#334052;stroke-width:2}.paper{fill:#f7f8fa;stroke:#cbd2dc;stroke-width:2}.bubble{fill:#24d8ff}.violet{fill:#8b6cff}.critical{fill:#ff625f}.attention{fill:#ffb347}</style><rect width="1600" height="1160" fill="#05070a"/><text x="48" y="48" class="title">MAGISTRATE · MVP wireframes / safe chat evidence</text><text x="48" y="72" class="muted">Obsidian command surfaces, cyan captain actions, violet system state, amber Attention.</text>
<g transform="translate(48 105)"><rect width="710" height="360" rx="16" class="frame"/><text x="24" y="32" class="label">CHAT</text><text x="24" y="57" class="muted">Magistrate · captain</text><rect x="28" y="88" width="420" height="48" rx="20" class="bubble"/><text x="48" y="118" fill="#05070a" font-size="13">Summarize the deploy</text><text x="28" y="174" class="body">The deploy is healthy. Three checks passed.</text><text x="28" y="203" class="muted">09:12 · response complete</text><rect x="24" y="278" width="650" height="54" rx="27" fill="#1b2432" stroke="#526176"/><text x="52" y="311" class="body">Ask Magistrate anything</text><circle cx="632" cy="305" r="18" class="violet"/><text x="626" y="310" fill="white">↑</text></g>
<g transform="translate(790 105)"><rect width="350" height="360" rx="16" class="frame"/><text x="24" y="32" class="label">DRAWER</text><text x="24" y="72" class="title">Workspace</text><text x="24" y="112" class="body">Attention · 2</text><text x="24" y="148" class="body">Fleet · 4 agents</text><text x="24" y="184" class="body">Activity</text><text x="24" y="220" class="body">Connections</text><text x="24" y="256" class="body">Settings</text><rect x="24" y="290" width="130" height="34" rx="17" fill="#24d8ff"/><text x="48" y="312" fill="#05070a" font-size="12">Close drawer</text></g>
<g transform="translate(1172 105)"><rect width="380" height="360" rx="16" class="frame"/><text x="24" y="32" class="label">ATTENTION ACTIONS</text><text x="24" y="78" class="title">Approve release?</text><text x="24" y="108" class="body">Deploy worker is blocked on your decision.</text><rect x="24" y="150" width="145" height="42" rx="21" class="bubble"/><text x="57" y="176" fill="#05070a" font-size="12">APPROVE</text><rect x="184" y="150" width="145" height="42" rx="21" fill="none" stroke="#ff625f"/><text x="230" y="176" fill="#ff625f" font-size="12">REJECT</text><text x="24" y="242" class="muted">No action is implied until confirmed.</text></g>
