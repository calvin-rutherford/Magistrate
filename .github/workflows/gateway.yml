name: Gateway

on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'

defaults:
  run:
    working-directory: gateway

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: |
          PYTHONPATH=. uv run pytest -v \
            tests/test_db_secrets.py \
            tests/test_oauth_transactions.py \
            tests/test_notification_transitions.py \
            tests/test_github_service.py \
            tests/test_stt_adapter.py \
            tests/test_jira_teams_attention_siri.py \
            tests/test_execution_capabilities.py
