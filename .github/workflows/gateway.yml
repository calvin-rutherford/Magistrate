name: Gateway

on:
  pull_request:
    paths:
      - 'scripts/production_acceptance.py'
      - 'scripts/test_postgres_release.py'
      - 'docs/CLIENT_PROTOCOL.md'
      - 'gateway/**'
      - 'runtime/firstmate-producer.lock.json'
      - 'scripts/install_firstmate_producer.sh'
      - '.github/workflows/gateway.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/production_acceptance.py'
      - 'scripts/test_postgres_release.py'
      - 'docs/CLIENT_PROTOCOL.md'
      - 'gateway/**'
      - 'runtime/firstmate-producer.lock.json'
      - 'scripts/install_firstmate_producer.sh'
      - '.github/workflows/gateway.yml'

defaults:
  run:
    working-directory: gateway

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build the exported frontend for SPA contract tests
        working-directory: frontend
        run: |
          npm ci
          npx expo export -p web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install and verify pinned Firstmate producer contract
        working-directory: .
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/magistrate-runtime
        run: |
          scripts/install_firstmate_producer.sh install
          scripts/install_firstmate_producer.sh verify
          echo "MAGISTRATE_TEST_PINNED_FIRSTMATE_ROOT=${XDG_DATA_HOME}/magistrate/firstmate-producer/2af0d17014cb2e244aa441bfe6df16c4f630475b" >> "$GITHUB_ENV"
      - name: Run complete hermetic gateway suite
        run: PYTHONPATH=. uv run pytest -v
      - name: Prove concurrent PostgreSQL startup and tenant persistence
        working-directory: .
        run: |
          mkdir -p .release
          python3 scripts/production_acceptance.py run --suite postgres-persistence --output .release/postgres.json
      - name: Export merged client validators without deployment access
        run: uv run python -m scripts.export_client_protocol > ../.release/client-protocol.json
      - name: Assert no generated repository drift
        working-directory: .
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: client-contract-and-postgres-receipt
          path: .release/*.json
          if-no-files-found: error
          retention-days: 14
